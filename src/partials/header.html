<header class="header">
  <div class="container container--header">

      href="/"
      aria-label="English Excellence home"
    >
      english<span class="header-logo-accent">excellence.</span>
    </a>

    <nav class="header-nav" aria-label="Primary navigation">
      <ul class="header-nav-list">
        <li><a class="header-nav-link" href="#about">About us</a></li>
        <li><a class="header-nav-link" href="#lessons">Our lessons</a></li>
        <li><a class="header-nav-link" href="#teachers">Teachers</a></li>
